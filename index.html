<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Muhamad Khalil Faizi Bin Ishak — Head, Process Automation</title>
<meta name="description" content="Muhamad Khalil Faizi Bin Ishak — Assistant Vice President and Head of Process Automation, Credit Guarantee Corporation (M) Bhd. Twenty years in automation, digital transformation and banking operations." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --orange:#FF4F00;
  --orange-deep:#C93B00;
  --ink:#201515;
  --ink-soft:#655B59;
  --cream:#FFFDF9;
  --peach:#FFE0D2;
  --butter:#FFE9C7;
  --mist:#E6E3F7;
  --moss:#DCE8DC;
  --line:#EFE7DF;
  --radius:18px;
  --radius-l:28px;
  --shell:1200px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange); outline-offset:3px; border-radius:4px}

h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif; font-weight:700; letter-spacing:-0.035em; line-height:1.02; margin:0}
h1{font-size:clamp(2.6rem,6vw,4.7rem)}
h2{font-size:clamp(2rem,4.2vw,3.3rem); line-height:1.05}
h3{font-size:1.2rem; letter-spacing:-0.02em; line-height:1.25}
p{margin:0}

.shell{max-width:var(--shell); margin:0 auto; padding:0 24px}
.section{padding:96px 0}
.section--tight{padding:64px 0}
.lede{font-size:1.12rem; color:var(--ink-soft); max-width:62ch}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 26px; border-radius:999px; font-weight:600; font-size:1rem;
  text-decoration:none; border:1.5px solid transparent; cursor:pointer;
  transition:background-color .18s ease, color .18s ease, border-color .18s ease;
}
.btn--primary{background:var(--orange); color:#fff}
.btn--primary:hover{background:var(--orange-deep)}
.btn--ghost{background:transparent; color:var(--ink); border-color:var(--ink)}
.btn--ghost:hover{background:var(--ink); color:var(--cream)}
.btn--light{background:var(--cream); color:var(--ink)}
.btn--light:hover{background:var(--peach)}
.btn--sm{padding:10px 18px; font-size:.94rem}
.eyebrow{
  display:inline-block; font-size:.9rem; font-weight:600; color:var(--orange-deep);
  background:var(--peach); padding:7px 15px; border-radius:999px; margin-bottom:22px;
}

/* ============================================================
   NAV
   ============================================================ */
.nav{position:sticky; top:0; z-index:50; background:rgba(255,253,249,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.nav__in{display:flex; align-items:center; gap:28px; height:70px}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; font-weight:600; letter-spacing:-.01em}
.brand__mark{
  width:34px; height:34px; border-radius:9px; background:var(--orange); color:#fff;
  display:grid; place-items:center; font-family:"Inter Tight",sans-serif;
  font-weight:700; font-size:.95rem; letter-spacing:-.03em;
}
.nav__links{display:flex; gap:26px; margin-left:auto}
.nav__links a{text-decoration:none; font-weight:500; font-size:.97rem; color:var(--ink-soft)}
.nav__links a:hover{color:var(--ink)}
.nav__cta{display:flex; gap:10px}
@media(max-width:980px){ .nav__links{display:none} .nav__cta{margin-left:auto} }
@media(max-width:520px){ .nav__cta .btn--ghost{display:none} }

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:84px 0 68px; text-align:center}
.hero h1{max-width:17ch; margin:0 auto}
.hero .lede{margin:26px auto 0; font-size:1.18rem}
.hero__cta{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:34px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:64px; text-align:left}
.stat{border-top:2px solid var(--ink); padding-top:16px}
.stat__n{font-family:"Inter Tight",sans-serif; font-weight:700; font-size:clamp(2rem,4vw,2.9rem); letter-spacing:-.04em; line-height:1}
.stat__l{color:var(--ink-soft); font-size:.97rem; margin-top:6px}
@media(max-width:720px){ .stats{grid-template-columns:1fr; gap:14px} }
.badges{display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin-top:44px; color:var(--ink-soft); font-size:.95rem}
.badges span{display:inline-flex; align-items:center; gap:8px}
.tick{width:16px; height:16px; flex:none; color:var(--orange)}

/* ============================================================
   MARQUEE
   ============================================================ */
.marq{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:44px 0; overflow:hidden}
.marq__title{text-align:center; color:var(--ink-soft); font-size:.95rem; margin-bottom:26px}
.marq__track{display:flex; gap:14px; width:max-content; animation:slide 34s linear infinite}
.marq:hover .marq__track{animation-play-state:paused}
.chip{
  border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:11px 22px;
  font-family:"Inter Tight",sans-serif; font-weight:600; font-size:1.05rem;
  letter-spacing:-.02em; white-space:nowrap;
}
@keyframes slide{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

/* ============================================================
   SUMMARY
   ============================================================ */
.summary{display:grid; grid-template-columns:repeat(3,1fr); gap:34px; margin-top:52px}
.summary p{color:#4A3E3C; font-size:1.02rem}
.summary > div{border-top:2px solid var(--ink); padding-top:22px}
.summary__n{font-family:"Inter Tight",sans-serif; font-weight:700; font-size:.82rem; color:var(--orange-deep); letter-spacing:.06em; margin-bottom:12px}
@media(max-width:900px){ .summary{grid-template-columns:1fr; gap:28px} }

/* ============================================================
   EXPERTISE BENTO
   ============================================================ */
.bento{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:52px}
.tile{border-radius:var(--radius-l); padding:34px; display:flex; flex-direction:column}
.tile--wide{grid-column:span 2}
.tile--peach{background:var(--peach)}
.tile--butter{background:var(--butter)}
.tile--mist{background:var(--mist)}
.tile--moss{background:var(--moss)}
.tile__chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
.tile__chips span{background:rgba(255,255,255,.72); color:#3A2E2C; font-weight:600; font-size:.88rem; padding:7px 14px; border-radius:9px}
@media(max-width:820px){ .bento{grid-template-columns:1fr} .tile--wide{grid-column:span 1} }

/* ============================================================
   EXPERIENCE TABS
   ============================================================ */
.work{display:grid; grid-template-columns:352px 1fr; gap:44px; margin-top:56px; align-items:start}
.tablist{display:flex; flex-direction:column; gap:6px}
.tab{
  display:flex; align-items:flex-start; gap:14px; text-align:left; background:none;
  border:0; cursor:pointer; width:100%; padding:16px 18px; border-radius:16px;
  font:inherit; color:var(--ink-soft); border-left:3px solid transparent; line-height:1.35;
  transition:background-color .15s ease, color .15s ease, border-color .15s ease;
}
.tab:hover{background:#fff}
.tab[aria-selected="true"]{background:#fff; color:var(--ink); border-left-color:var(--orange)}
.tab strong{display:block; font-weight:600; font-size:.99rem; letter-spacing:-.01em}
.tab small{display:block; font-weight:400; font-size:.85rem; margin-top:4px; opacity:.8}
.tab__txt{min-width:0}

.logo-chip{
  flex:none; border-radius:10px; background:#fff; border:1px solid var(--line);
  display:grid; place-items:center; overflow:hidden; width:38px; height:38px;
}
.logo-chip img{width:100%; height:100%; object-fit:contain; padding:5px}
.logo-chip span{font-family:"Inter Tight",sans-serif; font-weight:700; font-size:.7rem; letter-spacing:-.02em; color:var(--orange-deep); line-height:1}
.logo-chip--lg{width:60px; height:60px; border-radius:14px}
.logo-chip--lg img{padding:7px}
.logo-chip--lg span{font-size:.95rem}

.panel{background:#fff; border:1px solid var(--line); border-radius:var(--radius-l); padding:44px}
.panel__head{display:flex; align-items:center; gap:18px; padding-bottom:26px; margin-bottom:28px; border-bottom:1px solid var(--line)}
.panel__org{font-family:"Inter Tight",sans-serif; font-weight:700; font-size:1.15rem; letter-spacing:-.02em}
.panel__role{color:var(--ink-soft); font-size:.93rem; margin-top:3px}
.panel__meta{color:var(--orange-deep); font-weight:600; font-size:.92rem; margin-bottom:18px}
.panel ul{margin:0; padding-left:0; list-style:none; display:grid; gap:13px}
.panel li{display:flex; gap:11px; align-items:flex-start; color:#4A3E3C}
.panel li svg{flex:none; margin-top:4px; color:var(--orange)}
.subrole{margin-top:28px; padding-top:24px; border-top:1px solid var(--line)}
.subrole--first{margin-top:0; padding-top:0; border-top:0}
.subrole h4{font-family:"Inter Tight",sans-serif; font-weight:700; font-size:1.02rem; letter-spacing:-.02em; margin:0 0 14px}
.metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:32px; padding-top:26px; border-top:1px solid var(--line)}
.metrics .stat__n{font-size:1.9rem}
@media(max-width:1000px){
  .work{grid-template-columns:1fr; gap:26px}
  .tablist{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:8px; scrollbar-width:thin}
  .tab{border-left:0; border-bottom:3px solid transparent; white-space:nowrap; flex:none; width:auto; align-items:center}
  .tab[aria-selected="true"]{border-left-color:transparent; border-bottom-color:var(--orange)}
  .tab small{display:none}
  .panel{padding:28px}
  .panel__head{gap:14px; padding-bottom:20px; margin-bottom:22px}
  .metrics{grid-template-columns:1fr; gap:14px}
}

/* ============================================================
   ACHIEVEMENTS
   ============================================================ */
.ach{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:52px}
.ach__card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-l); padding:38px; display:flex; flex-direction:column}
.ach__card ul{margin:22px 0 0; padding:0; list-style:none; display:grid; gap:13px}
.ach__card li{display:flex; gap:11px; align-items:flex-start; color:#4A3E3C; font-size:1rem}
.ach__card li svg{flex:none; margin-top:4px; color:var(--orange)}
.ach__pull{display:flex; gap:32px; flex-wrap:wrap; margin-top:auto; padding-top:26px; border-top:1px solid var(--line)}
.ach__pull .stat{border-top:0; padding-top:24px}
.ach__pull .stat__n{font-size:1.8rem; color:var(--orange-deep)}
@media(max-width:900px){ .ach{grid-template-columns:1fr} }

/* ============================================================
   COUNTER
   ============================================================ */
.counter{background:var(--ink); color:var(--cream); border-radius:var(--radius-l); padding:70px 34px; text-align:center}
.counter h2{color:#fff}
.counter__n{
  font-family:"Inter Tight",sans-serif; font-weight:700; font-size:clamp(2.8rem,9vw,7rem);
  letter-spacing:-.05em; line-height:1; color:var(--orange); margin:26px 0 8px; font-variant-numeric:tabular-nums;
}
.counter p{color:rgba(255,253,249,.72); max-width:56ch; margin:0 auto}
.counter__scale{display:flex; justify-content:space-between; gap:16px; max-width:640px; margin:38px auto 0; color:rgba(255,253,249,.5); font-size:.85rem; border-top:1px solid rgba(255,253,249,.22); padding-top:10px}

/* ============================================================
   EDUCATION + CERTIFICATIONS
   ============================================================ */
.four{display:grid; grid-template-columns:repeat(3,1fr); gap:34px; margin-top:52px}
.four p{color:var(--ink-soft); margin-top:11px; font-size:.99rem}
.four > div{border-top:2px solid var(--ink); padding-top:20px}
@media(max-width:820px){ .four{grid-template-columns:1fr; gap:26px} }

.creds{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:52px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.cred{background:var(--cream); padding:30px}
.cred--fill{background:#fff}
.cred h3{font-size:1.05rem}
.cred__head{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.cred__logo{width:48px; height:48px; flex:none; border-radius:12px; background:#fff; border:1px solid var(--line); display:grid; place-items:center; overflow:hidden}
.cred__logo img{width:100%; height:100%; object-fit:contain; padding:7px}
.cred__mark{font-family:"Inter Tight",sans-serif; font-weight:700; font-size:.82rem; letter-spacing:-.02em; color:var(--orange-deep); text-align:center; line-height:1}
.cred ul{margin:0; padding:0; list-style:none; display:grid; gap:9px}
.cred li{color:var(--ink-soft); font-size:.92rem; line-height:1.45; padding-left:15px; position:relative}
.cred li::before{content:""; position:absolute; left:0; top:.58em; width:5px; height:5px; border-radius:50%; background:var(--orange)}
@media(max-width:880px){ .creds{grid-template-columns:repeat(2,1fr)} }
@media(max-width:560px){ .creds{grid-template-columns:1fr} }

/* ============================================================
   CTA + FOOTER
   ============================================================ */
.cta{background:var(--orange); color:#fff; border-radius:var(--radius-l); padding:74px 34px; text-align:center}
.cta h2{color:#fff; max-width:20ch; margin:0 auto}
.cta p{color:rgba(255,255,255,.9); margin:20px auto 0; max-width:52ch}
.cta__row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:32px}
.cta .btn--ghost{border-color:rgba(255,255,255,.75); color:#fff}
.cta .btn--ghost:hover{background:#fff; color:var(--orange-deep)}
.foot{border-top:1px solid var(--line); padding:48px 0; margin-top:96px}
.foot__in{display:flex; gap:26px; flex-wrap:wrap; align-items:center; color:var(--ink-soft); font-size:.94rem}
.foot__links{display:flex; gap:20px; margin-left:auto; flex-wrap:wrap}
.foot__links a{text-decoration:none}
.foot__links a:hover{color:var(--orange-deep)}

@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="nav">
  <div class="shell nav__in">
    <a class="brand" href="#top">
      <span class="brand__mark" id="mono">KF</span>
      <span id="brandName"></span>
    </a>
    <nav class="nav__links">
      <a href="#summary">Summary</a>
      <a href="#expertise">Expertise</a>
      <a href="#experience">Experience</a>
      <a href="#achievements">Achievements</a>
      <a href="#certifications">Certifications</a>
    </nav>
    <div class="nav__cta">
      <a class="btn btn--ghost btn--sm" href="#" id="cvLink">Download resume</a>
      <a class="btn btn--primary btn--sm" href="#contact">Get in touch</a>
    </div>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="shell">
      <span class="eyebrow" id="heroEyebrow"></span>
      <h1 id="heroTitle"></h1>
      <p class="lede" id="heroLede"></p>
      <div class="hero__cta">
        <a class="btn btn--primary" href="#experience">See the experience</a>
        <a class="btn btn--ghost" href="#contact">Get in touch</a>
      </div>
      <div class="stats" id="heroStats"></div>
      <div class="badges" id="heroBadges"></div>
    </div>
  </section>

  <section class="marq">
    <p class="marq__title" id="marqTitle"></p>
    <div class="marq__track" id="marqTrack"></div>
  </section>

  <section class="section" id="summary">
    <div class="shell">
      <h2 id="sumTitle"></h2>
      <div class="summary" id="sumGrid"></div>
    </div>
  </section>

  <section class="section" id="expertise" style="background:#FFF8F2">
    <div class="shell">
      <h2 id="expTitle"></h2>
      <p class="lede" style="margin-top:18px" id="expLede"></p>
      <div class="bento" id="bento"></div>
    </div>
  </section>

  <section class="section" id="experience">
    <div class="shell">
      <h2 id="workTitle"></h2>
      <p class="lede" style="margin-top:18px" id="workLede"></p>
      <div class="work">
        <div class="tablist" role="tablist" aria-label="Professional experience" id="tablist"></div>
        <div class="panel" id="panel" role="tabpanel" tabindex="0"></div>
      </div>
    </div>
  </section>

  <section class="section" id="achievements" style="background:#FFF8F2">
    <div class="shell">
      <h2 id="achTitle"></h2>
      <p class="lede" style="margin-top:18px" id="achLede"></p>
      <div class="ach" id="achGrid"></div>
    </div>
  </section>

  <section class="section" id="results">
    <div class="shell">
      <div class="counter">
        <h2 id="cntTitle"></h2>
        <div class="counter__n" id="cntNum">0</div>
        <p id="cntLabel"></p>
        <div class="counter__scale"><span id="cntFrom"></span><span id="cntTo"></span></div>
      </div>
    </div>
  </section>

  <!-- GOVERNANCE ROLES -->
  <section class="section section--tight" id="stewardship">
    <div class="shell">
      <h2 id="govTitle"></h2>
      <p class="lede" style="margin-top:18px" id="govLede"></p>
      <div class="four" id="gov"></div>
    </div>
  </section>

  <section class="section" id="education">
    <div class="shell">
      <h2 id="eduTitle"></h2>
      <div class="four" id="eduGrid"></div>
    </div>
  </section>

  <section class="section section--tight" id="certifications">
    <div class="shell">
      <h2 id="certTitle"></h2>
      <p class="lede" style="margin-top:18px" id="certLede"></p>
      <div class="creds" id="certGrid"></div>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="shell">
      <div class="cta">
        <h2 id="ctaTitle"></h2>
        <p id="ctaLede"></p>
        <div class="cta__row">
          <a class="btn btn--light" id="ctaMail" href="#">Email me</a>
          <a class="btn btn--ghost" id="ctaLinked" href="#">Connect on LinkedIn</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="shell foot__in">
    <span id="footName"></span>
    <div class="foot__links">
      <a href="#summary">Summary</a>
      <a href="#experience">Experience</a>
      <a href="#certifications">Certifications</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</footer>

<script>
/* ============================================================================
   ALL CONTENT LIVES HERE, TAKEN FROM YOUR JSON. Nothing below it needs editing.
   ============================================================================ */
/* ============================================================================
   LOGOS — embedded images, generated. No logos/ folder needed; nothing to upload.
   To swap one, replace its data: URI, or set a path like "logos/new.png".

/* ============================================================================
   RENDERING — no need to edit below.
   ============================================================================ */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n = document.createElement(t); if(c) n.className = c; if(h!==undefined) n.innerHTML = h; return n; };
const tick  = '<svg class="tick" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
const check = '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>';
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const statBlock = s => `<div class="stat"><div class="stat__n">${s.n}</div><div class="stat__l">${s.l}</div></div>`;
const bulletList = arr => `<ul>${arr.map(x=>`<li>${check}<span>${x}</span></li>`).join("")}</ul>`;
const logoChip = (o, label, lg) => {
  const mark = `<span${o.logo ? ' style="display:none"' : ''}>${o.mark||""}</span>`;
  const img  = o.logo
    ? `<img src="${o.logo}" alt="${label} logo" loading="lazy"
         onerror="var p=this.parentNode; this.remove(); p.querySelector('span').style.display='block'">`
    : "";
  return `<span class="logo-chip${lg ? ' logo-chip--lg' : ''}">${img}${mark}</span>`;
};

     <div class="tile__chips">${g.items.map(x=>`<span>${x}</span>`).join("")}</div>
   </article>`).join("");

/* experience tabs */
$("#workTitle").textContent = RESUME.work.title;
$("#workLede").textContent  = RESUME.work.lede;
const tablist = $("#tablist"), panel = $("#panel");
RESUME.work.items.forEach((it,i)=>{
  const b = el("button","tab",
    logoChip(it, it.tab) + `<span class="tab__txt"><strong>${it.tab}</strong><small>${it.sub}</small></span>`);
  b.setAttribute("role","tab");
  b.setAttribute("aria-selected", i===0 ? "true" : "false");
  b.addEventListener("click", ()=>selectTab(i));
  tablist.appendChild(b);
});
function selectTab(i){
  const it = RESUME.work.items[i];
  [...tablist.children].forEach((b,j)=>b.setAttribute("aria-selected", j===i ? "true":"false"));
  const body = it.roles
    ? it.roles.map((r,k)=>`<div class="subrole ${k===0?'subrole--first':''}"><h4>${r.role}</h4>${bulletList(r.bullets)}</div>`).join("")
    : bulletList(it.bullets);
  panel.innerHTML =
    `<div class="panel__head">${logoChip(it, it.tab, true)}
       <div><div class="panel__org">${it.org}</div><div class="panel__role">${it.sub}</div></div>
     </div>
     <p class="panel__meta">${it.meta}</p>
     ${body}
     ${it.metrics ? `<div class="metrics">${it.metrics.map(statBlock).join("")}</div>` : ""}`;
}
selectTab(0);
tablist.addEventListener("keydown", e=>{
  const cur = [...tablist.children].findIndex(b=>b.getAttribute("aria-selected")==="true");
  let next = null;
  if(e.key==="ArrowDown"||e.key==="ArrowRight") next = (cur+1)%RESUME.work.items.length;
  if(e.key==="ArrowUp"||e.key==="ArrowLeft")    next = (cur-1+RESUME.work.items.length)%RESUME.work.items.length;
  if(next!==null){ e.preventDefault(); selectTab(next); tablist.children[next].focus(); }
});

/* achievements */

$("#achLede").textContent  = RESUME.achievements.lede;

/* counter */
const C = RESUME.counter;
$("#cntTitle").textContent = C.title;
$("#cntLabel").textContent = C.label;
$("#cntFrom").textContent  = C.from;
$("#cntTo").textContent    = C.to;
const numEl = $("#cntNum");
const fmt = v => C.prefix + Math.round(v).toLocaleString() + C.suffix;
if(reduced){ numEl.textContent = fmt(C.number); }
else {
  numEl.textContent = fmt(0);
  new IntersectionObserver((entries,obs)=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      obs.disconnect();
      const dur = 1600, t0 = performance.now();
      (function step(now){
        const p = Math.min((now-t0)/dur, 1);
        numEl.textContent = fmt(C.number * (1 - Math.pow(1-p,3)));
        if(p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }, {threshold:.4}).observe(numEl);
}

    <ul>${g.items.map(x=>`<li>${x}</li>`).join("")}</ul>
  </div>`;
}).join("");

$("#ctaLede").textContent  = RESUME.cta.lede;
